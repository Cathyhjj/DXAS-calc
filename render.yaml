services:
  - type: web
    name: dxascalc-web
    runtime: python
    plan: free
    buildCommand: npm ci --prefix frontend --cache /tmp/npm-cache && npm run build --prefix frontend && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 22.14.0
